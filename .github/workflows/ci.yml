name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Project constraint checks
        run: |
          fail=0
          FILES="index.html v2/index.html"
          check() { # description, regex
            if grep -nE "$2" $FILES; then echo "::error::$1"; fail=1; fi
          }
          check "External script/stylesheet/import (no CDN or web fonts)" '<script[^>]+src=|<link[^>]+href=["'"'"']?https?:|@import'
          check "Browser persistence is not allowed" 'localStorage|sessionStorage|indexedDB|document\.cookie'
          check "alert()/confirm() are not allowed" '(^|[^A-Za-z_.])(alert|confirm)\('
          check "!important is not allowed" '!important'
          # Only formsubmit.co may appear as an http(s) host
          if grep -noE 'https?://[A-Za-z0-9.-]+' $FILES | grep -v 'formsubmit\.co'; then
            echo "::error::Unexpected external host (only formsubmit.co allowed)"; fail=1
          fi
          exit $fail

      - name: Validate HTML
        run: npx --yes html-validate@8 --rule aria-label-misuse:off index.html v2/index.html

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (v1 at root, v2 at /v2/)
        run: mkdir -p _site/v2 && cp index.html _site/ && cp v2/index.html _site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
